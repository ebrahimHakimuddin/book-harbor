services:
  bookharbor:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      BOOKHARBOR_ADDR: ":8080"
      BOOKHARBOR_DATA_DIR: /data
      BOOKHARBOR_NAME: "${BOOKHARBOR_NAME:-BookHarbor}"
      BOOKHARBOR_MAX_UPLOAD_BYTES: "${BOOKHARBOR_MAX_UPLOAD_BYTES:-536870912}"
      BOOKHARBOR_LIBRARY_DIRS: "${BOOKHARBOR_LIBRARY_DIRS:-}"
      BOOKHARBOR_LIBRARY_ALLOW_DIRS: "${BOOKHARBOR_LIBRARY_ALLOW_DIRS:-}"
      BOOKHARBOR_SCAN_INTERVAL: "${BOOKHARBOR_SCAN_INTERVAL:-15m}"
      BOOKHARBOR_HARDCOVER_TOKEN: "${BOOKHARBOR_HARDCOVER_TOKEN:-}"
    ports:
      - "${BOOKHARBOR_PORT:-8080}:8080"
    volumes:
      - bookharbor-data:/data
      # Mount an existing NAS library read-only, then set BOOKHARBOR_LIBRARY_DIRS=/library.
      # - /mnt/nas/books:/library:ro
    restart: unless-stopped

volumes:
  bookharbor-data:
